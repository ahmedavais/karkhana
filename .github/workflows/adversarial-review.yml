name: Adversarial review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: adversarial-review-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          repository: ahmedavais/karkhana
          ref: main
          path: .karkhana
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          FILES="$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')"
          COMMITS="$(gh api --paginate "repos/$REPO/pulls/$PR/commits" --jq '.[] | "\(.author.login // "unknown") \(.commit.verification.verified)"')"
          export FILES COMMITS
          node .karkhana/review/routine-update-cli.js
      - if: steps.scope.outputs.routine != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: renovate
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read .karkhana/briefs/adversarial-review.md and follow it. The pull request is checked out in the working
            directory. karkhana's main branch is checked out in .karkhana: the shared workflows this project calls.
          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
