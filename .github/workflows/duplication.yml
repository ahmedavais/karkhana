name: Duplication

on:
  workflow_call:

permissions:
  contents: read

jobs:
  new-clones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check there is a commit to compare with
        run: |
          if [ -z "$BASELINE" ] || [ -z "${BASELINE//0/}" ]; then
            echo "::error::No commit to compare with (BASELINE='$BASELINE'): a ${{ github.event_name }} event that isn't a pull request or a push with a commit before it. Call this job only on pull requests and pushes to an existing branch"
            exit 1
          fi
        env:
          BASELINE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      - run: npx --yes jscpd@5.4.1 . --baseline-from-ref "$BASELINE" --fail-on-new-clones --reporters console
        env:
          BASELINE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
