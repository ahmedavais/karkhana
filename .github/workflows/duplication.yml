name: Duplication

on:
  workflow_call:

permissions:
  contents: read

jobs:
  new-clones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: npx --yes jscpd@5.4.0 . --baseline-from-ref "$BASELINE" --fail-on-new-clones --reporters console
        env:
          BASELINE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
