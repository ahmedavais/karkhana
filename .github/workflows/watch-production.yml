name: Watch production

on:
  workflow_call:
    inputs:
      script:
        type: string
        default: watch-production

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run "$SCRIPT"
        env:
          SCRIPT: ${{ inputs.script }}
