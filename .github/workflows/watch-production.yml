name: Watch production

on:
  workflow_call:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: soon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          not-an-input: true
          cache: npm
      - run: npm ci
      - run: npm run watch-production
